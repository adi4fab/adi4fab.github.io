<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- edit this title freely -->
  <title>🎂</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: #000;                 /* black theme */
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;                /* fallback for older browsers */
      overflow: hidden;
    }
    @supports (min-height: 100dvh) {
      body { min-height: 100dvh; }      /* mobile: exclude the address-bar area */
    }

    /* the cycling word and the final message both sit dead-center, stacked */
    #greeting, #finale {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 100%;
      padding: 0 1.25rem;               /* keep text off the screen edges */
      text-align: center;
      opacity: 0;
      transform: translate(-50%, -50%) translateY(12px);
      will-change: opacity, transform;
      /* transition duration is set from JS (FADE_MS) so there's one knob */
    }
    #greeting.show, #finale.show {
      opacity: 1;
      transform: translate(-50%, -50%) translateY(0);
    }

    /* the cycling word (बहन, lil sis, ...) */
    #greeting {
      font-size: clamp(2.5rem, 10vw, 6rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      z-index: 1;
    }

    /* the final message */
    #finale { z-index: 1; }
    #finale .line1 {
      font-size: clamp(1.4rem, 5vw, 2.4rem);
      font-weight: 500;
      opacity: 0.85;
      margin-bottom: 0.4em;
    }
    #finale .line2 {
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.25);
    }

    /* "Click to select gift" trigger — fades in a moment after the message */
    #giftBtn {
      margin-top: 1.5rem;
      font: inherit;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      font-weight: 600;
      color: #fff;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 300ms ease, transform 120ms ease, background 160ms ease, border-color 160ms ease;
    }
    #giftBtn.show { opacity: 1; }
    #giftBtn:hover { background: #1e1e1e; border-color: #3a3a3a; transform: translateY(-1px); }
    #giftBtn:active { transform: translateY(0); }

    /* the gift options, stacked one below the other (hidden until the button is clicked) */
    #gifts {
      margin-top: 1rem;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      max-height: 55vh;         /* if the list grows long, scroll instead of clipping */
      overflow-y: auto;
    }
    #gifts.show { display: flex; }

    .gift {
      width: min(320px, 80vw);
      font: inherit;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      font-weight: 600;
      color: #fff;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 0.9rem 1.1rem;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }
    .gift:hover { background: #1e1e1e; border-color: #3a3a3a; }

    /* once clicked: show the roast reply */
    .gift.revealed {
      cursor: default;
      color: #ff4d6d;
      background: #1a0f12;
      border-color: rgba(255, 77, 109, 0.4);
      animation: shake 350ms ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* the one accepted gift turns green instead of red */
    .gift.accepted {
      color: #00f5a0;
      background: #0f1a15;
      border-color: rgba(0, 245, 160, 0.4);
    }

    /* full-screen send-off page */
    #outro {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1.25rem;
      font-size: clamp(2rem, 9vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      opacity: 0;
      visibility: hidden;
      transition: opacity 500ms ease;
    }
    #outro.show { opacity: 1; visibility: visible; }

    /* confetti / explosion canvas — flies over the text */
    #blast {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* quick white flash at the moment of the blast */
    #flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      z-index: 3;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="blast"></canvas>
  <div id="flash"></div>

  <!-- the cycling word -->
  <div id="greeting" aria-live="polite"></div>

  <!-- the final message (edit the text freely) -->
  <div id="finale">
    <p class="line1">Marenge, chakku niklenga, khoon&hellip;</p>
    <p class="line2">behen ka bday coming soon 🎂</p>
    <button id="giftBtn" type="button">🎁 Click to select gift</button>
    <div id="gifts"></div>
  </div>

  <!-- final send-off page -->
  <div id="outro">chal nikal bye 👋</div>

  <script>
    // ------------------ tweak these ------------------
    const WORDS   = ["बहन", "lil sis", "শৌরাঙ্কা", "babe"]; // babe is the last cycling word
    const HOLD_MS = 450;   // how long each word sits fully visible (bigger = slower)
    const FADE_MS = 300;   // fade in / fade out duration
    // -------------------------------------------------

    const el     = document.getElementById("greeting");
    const finale = document.getElementById("finale");
    el.style.transition     = `opacity ${FADE_MS}ms ease, transform ${FADE_MS}ms ease`;
    finale.style.transition = `opacity ${FADE_MS}ms ease, transform ${FADE_MS}ms ease`;

    let i = 0;

    function showWord() {
      el.textContent = WORDS[i];
      requestAnimationFrame(() => el.classList.add("show")); // fade in

      // last word -> hold it, fade it out, then run the finale + blast
      if (i === WORDS.length - 1) {
        setTimeout(() => {
          el.classList.remove("show");
          setTimeout(showFinale, FADE_MS);
        }, FADE_MS + HOLD_MS + 200);
        return;
      }

      // otherwise: stay visible, fade out, move to the next word
      setTimeout(() => {
        el.classList.remove("show");
        setTimeout(() => { i++; showWord(); }, FADE_MS);
      }, FADE_MS + HOLD_MS);
    }

    function showFinale() {
      requestAnimationFrame(() => finale.classList.add("show")); // fade message in
      flash();
      fireBlast();                 // three staggered bursts = one big blast
      setTimeout(fireBlast, 350);
      setTimeout(fireBlast, 700);
      setTimeout(() => giftBtn.classList.add("show"), 700); // button pops in after the message settles
    }

    // the full-screen "chal nikal bye" send-off page
    function showOutro() {
      document.getElementById("outro").classList.add("show");
    }

    // ---------- white flash ----------
    const flashEl = document.getElementById("flash");
    function flash() {
      flashEl.style.transition = "none";
      flashEl.style.opacity = "0.85";
      requestAnimationFrame(() => {
        flashEl.style.transition = "opacity 500ms ease";
        flashEl.style.opacity = "0";
      });
    }

    // ---------- confetti explosion (no libraries, works offline) ----------
    const canvas = document.getElementById("blast");
    const ctx    = canvas.getContext("2d");
    const COLORS = ["#ff4d6d", "#ffd54a", "#4dd0e1", "#9b5de5", "#00f5a0", "#ff8c42", "#ffffff"];
    let particles = [];
    let rafId = null;

    function sizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    sizeCanvas();
    window.addEventListener("resize", sizeCanvas);

    function fireBlast() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const count = 160;
      for (let k = 0; k < count; k++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 9;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,   // slight upward bias
          size: 4 + Math.random() * 7,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          life: 1,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.35,
        });
      }
      if (!rafId) tick();
    }

    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.vy  += 0.18;    // gravity
        p.vx  *= 0.99;    // air drag
        p.x   += p.vx;
        p.y   += p.vy;
        p.rot += p.vr;
        p.life -= 0.008;
        ctx.save();
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }
      particles = particles.filter(p => p.life > 0 && p.y < canvas.height + 50);
      if (particles.length) {
        rafId = requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        rafId = null;
      }
    }

    // ---------- gift picker ----------
    const GIFTS = [
      { label: "Dress",        reply: "nahi, size nahi milega" },
      { label: "Shoes",        reply: "nahi, gande ho jayenge" },
      { label: "Diamond ring", reply: "nahi, Me gareeb hoon" },
      { label: "Bag",          reply: "nahi, koi chura lega" },
      { label: "Chappal",      reply: "Yes, chal thik hai, teri khushi hi meri khushi 🙏", accept: true },
    ];

    const giftBtn = document.getElementById("giftBtn");
    const giftsEl = document.getElementById("gifts");

    // build one clickable box per gift; clicking it swaps the label for the roast
    GIFTS.forEach(g => {
      const box = document.createElement("button");
      box.type = "button";
      box.className = "gift";
      box.textContent = g.label;
      box.addEventListener("click", () => {
        if (box.classList.contains("revealed")) return; // already opened
        box.textContent = g.reply;
        box.classList.add("revealed");
        if (g.accept) {                        // the one gift he'll actually accept
          box.classList.add("accepted");       // turns green instead of red
          setTimeout(showOutro, 5000);         // wait 5s, then the "chal nikal bye" page appears
        }
      });
      giftsEl.appendChild(box);
    });

    // first click opens the list and hides the trigger button
    giftBtn.addEventListener("click", () => {
      giftsEl.classList.add("show");
      giftBtn.style.display = "none";
    });

    showWord();
  </script>
</body>
</html>
